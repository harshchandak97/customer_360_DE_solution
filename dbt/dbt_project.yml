name: customer_360
version: "1.0.0"
config-version: 2
profile: customer_360

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]

vars:
  # Staging models that feed the unified customer table.
  # New source = add its staging model here (plus an entry in config/sources.yml).
  customer_staging_models: ["stg_crm_customers", "stg_ecom_users"]
  default_country_code: "91"   # used when a phone number has no country code

  # Matching decision thresholds (points come from seeds/match_rules.csv)
  auto_match_threshold: 70      # score >= 70  -> same person, merge automatically
  review_threshold: 40          # 40..69       -> a human reviews the pair
  name_similarity_min: 0.90     # Jaro-Winkler (0..1) needed for "similar name"
  max_expected_cluster_size: 10 # warn if one "person" has more records than this (over-merging)

  # Accuracy check against a hand-labelled answer key (data/expected/ground_truth.csv).
  # Set to false when running on real data that has no answer key.
  evaluate_accuracy: true
  min_match_precision: 0.95     # fail the run if more than 5% of merges are wrong

# After every run/build: record each data quality check's result in quality.dq_results
on-run-end:
  - "{{ log_dq_results(results) }}"

models:
  customer_360:
    staging:
      +schema: staging
      +materialized: view      # cheap, always reflects the latest raw data
    intermediate:
      +schema: intermediate
      +materialized: table
    quality:
      +schema: quality
      +materialized: table
    marts:
      +schema: marts
      +materialized: table

seeds:
  customer_360:
    +schema: reference
